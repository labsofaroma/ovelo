version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 8
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Pinned deliberately; upgrade in a dedicated PR (REWRITE-PLAN §3: one @solana/kit version).
      - dependency-name: "@solana/kit"
        update-types: ["version-update:semver-major"]
      # React is pinned to 19.2.x (M4). Minors are reviewed by hand with Next.js compatibility.
      - dependency-name: "react"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: cargo
    directory: /packages/contracts
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # Contract dependencies change the audited surface: review by hand, never auto-merge.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  # Phase H: the image's base (node:24.12.0-slim, pinned by digest in deploy/Dockerfile). A digest
  # bump is a rebuild + scan + sign by image.yml, then a deploy by the owner.
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    ignore:
      # Node majors and minors move with .nvmrc and engines; review those by hand.
      - dependency-name: "node"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]

  # Phase H: cloudflared (pinned by version and digest in the compose bundle).
  - package-ecosystem: docker-compose
    directory: /deploy/hostinger
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
