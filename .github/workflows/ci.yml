name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Optional Turborepo remote cache. Unset secrets simply disable it; the local cache below still applies.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      # Telemetry off in CI.
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Format check (new code)
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Load placeholder environment for the build
        # .env.example holds placeholders only. The build validates them exactly like a real deploy.
        run: grep -E '^[A-Z][A-Z0-9_]*=' apps/web/.env.example >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build

      - name: Dependency audit (informational)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

  ui-a11y:
    # AUTHORED IN M1, NOT YET RUN ON GITHUB. Real-browser axe over every @aroma/ui story (light and
    # dark), keyboard flows and reduced-motion checks. See packages/ui/README.md "The accessibility gate".
    name: UI accessibility (axe, keyboard, reduced motion)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter @aroma/ui exec playwright install --with-deps chromium

      - name: Build the workbench
        run: pnpm --filter @aroma/ui build:stories

      - name: axe, keyboard and reduced-motion suites
        run: pnpm --filter @aroma/ui test:a11y
