# Phase H Step 6: build, scan, sign and publish the self-host image (docs/launch/SELF-HOST.md).
#
#   test gate → build + push by digest → Trivy scan (fail on Critical/High with a fix) → SBOM →
#   cosign keyless signature → build provenance and SBOM attestations.
#
# There is NO deploy job, on purpose. CI never holds SSH access, a VPS address or a server
# credential: the owner runs deploy.sh on the VPS, which pulls by DIGEST and refuses an image
# whose cosign signature is not from THIS workflow on main or a v* tag. A compromised CI can at
# worst publish an image; it cannot reach the server or make the server run anything. An image
# that fails the scan is pushed but never signed, so deploy.sh refuses it.
#
# Hardening: minimal permissions per job, every action pinned by commit SHA (Dependabot bumps
# them), no secret besides the job's own GITHUB_TOKEN and OIDC identity, NEXT_PUBLIC_* from
# repository VARIABLES (public values, never secrets), checkout without persisted credentials.
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/aromalabs/aroma-web
  NEXT_TELEMETRY_DISABLED: "1"
  TRIVY_VERSION: v0.76.1
  COSIGN_VERSION: v3.1.4

jobs:
  gate:
    name: Test gate (typecheck, lint, format, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.31.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build with the placeholder environment (validated like a real deploy)
        run: |
          grep -E '^[A-Z][A-Z0-9_]*=' apps/web/.env.example >> "$GITHUB_ENV"
      - run: pnpm build:web

  image:
    name: Build, scan, sign, attest
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless and attestations (OIDC)
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tags (commit SHA, plus the version on a v* tag; never latest)
        id: meta
        run: |
          tags="${IMAGE}:sha-${GITHUB_SHA}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tags="${tags},${IMAGE}:${GITHUB_REF_NAME}"; fi
          {
            echo "tags=${tags}"
            echo "version=${GITHUB_REF_NAME//\//-}"
            echo "epoch=$(git log -1 --format=%ct)"
          } >> "$GITHUB_OUTPUT"

      # An unset repository variable would be passed as an EMPTY build arg, which overrides the
      # Dockerfile default and inlines "" into the browser bundle. Refuse instead.
      - name: Required public build values (repository variables)
        env:
          RPC: ${{ vars.NEXT_PUBLIC_SOLANA_RPC_URL }}
          SENTRY: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
        run: |
          missing=""
          [ -n "${RPC}" ] || missing="${missing} NEXT_PUBLIC_SOLANA_RPC_URL"
          [ -n "${SENTRY}" ] || missing="${missing} NEXT_PUBLIC_SENTRY_DSN"
          if [ -n "${missing}" ]; then
            echo "::error::set these repository variables (Settings > Secrets and variables > Actions > Variables):${missing}"
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64, the VPS architecture)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
        with:
          context: .
          file: deploy/Dockerfile
          # The deployable image only (never the local runtime-e2e variant).
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Attestations are produced below as signed GitHub attestations.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Public build inputs only (repository variables). No secret is ever a build arg.
          build-args: |
            AROMA_REVISION=${{ github.sha }}
            AROMA_VERSION=${{ steps.meta.outputs.version }}
            NEXT_PUBLIC_SOLANA_RPC_URL=${{ vars.NEXT_PUBLIC_SOLANA_RPC_URL }}
            NEXT_PUBLIC_SOLANA_WS_URL=${{ vars.NEXT_PUBLIC_SOLANA_WS_URL }}
            NEXT_PUBLIC_SOLANA_DEVNET_RPC_URL=${{ vars.NEXT_PUBLIC_SOLANA_DEVNET_RPC_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_PLAUSIBLE_DOMAIN=${{ vars.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Scan for vulnerabilities (fail on Critical or High with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign the digest (keyless; identity = this workflow at this ref)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: The digest to deploy
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Image"
            echo
            echo "\`${IMAGE}@${DIGEST}\`"
            echo
            echo "On the VPS: \`sudo /opt/aroma/deploy.sh ${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Artifact attestations need a public repository or GitHub Enterprise Cloud. On a private
      # repository they fail; the signed digest above is what deploy.sh verifies, so they do not
      # block the job.
      - name: Build provenance attestation
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: SBOM attestation
        continue-on-error: true
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
