[package]
name = "aroma_guard"
version = "1.0.0"
description = "Aroma Guard v1: oracle-bounded recurring investing on Solana"
edition = "2021"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "aroma_guard"

[features]
default = []
# Devnet build: mints test stock at the oracle price. The default (mainnet) build compiles
# without any minting code and execute_installment fails closed until M8 (Jupiter CPI).
devnet-mock = []
anchor-debug = []
custom-heap = []
custom-panic = []
no-entrypoint = []
cpi = ["no-entrypoint"]
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# No `init-if-needed`: every account is created exactly once with `init`.
anchor-lang = { version = "=1.2.1" }
anchor-spl = { version = "=1.2.1", default-features = false, features = ["token", "token_2022", "token_2022_extensions", "associated_token", "solana-v3"] }
pyth-solana-receiver-sdk = { version = "=2.0.0" }
solana-security-txt = "=1.1.3"

[dev-dependencies]
proptest = "1"
# Tests only: recomputes the pinned Jupiter route_v2 discriminator.
sha2 = "=0.10.9"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
