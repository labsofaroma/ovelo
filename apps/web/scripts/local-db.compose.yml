# Local Postgres for development and the creator E2E (M5b B6). LOCAL ONLY: test credentials,
# bound to 127.0.0.1. The Neon serverless driver reaches Postgres through Neon's open-source
# WebSocket proxy (server/db/local-neon.ts). Started and stopped by scripts/local-db.sh.
name: ovelo-local-db
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ovelo
      POSTGRES_PASSWORD: ovelo-local-only
      POSTGRES_DB: ovelo
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovelo -d ovelo"]
      interval: 1s
      timeout: 3s
      retries: 30
  neon-proxy:
    image: ghcr.io/neondatabase/wsproxy:latest
    environment:
      APPEND_PORT: "postgres:5432"
      ALLOW_ADDR_REGEX: ".*"
      LOG_TRAFFIC: "false"
    ports:
      - "127.0.0.1:54330:80"
    depends_on:
      postgres:
        condition: service_healthy
